name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; never cancel a deployment mid-flight.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # PAGES_BASE switches the build into static mode: the site is prerendered
      # to plain HTML and every asset URL is prefixed with the repository
      # subpath, so it loads from https://Mohameedmn.github.io/screenshot-to-pixel-perfect-267/.
      - name: Build the static site
        env:
          PAGES_BASE: /screenshot-to-pixel-perfect-267/
        run: bun run build

      # GitHub Pages serves 404.html for unknown paths; reuse the built page.
      - name: Add a 404 fallback
        run: cp dist/client/index.html dist/client/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
